{% extends 'base.html' %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center text-center mt-5 mb-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 p-5">
            <div class="display-1 fw-bold text-secondary mb-3">500</div>
            <h1 class="h3 fw-bold text-dark mb-3">Internal Server Error</h1>
            <p class="text-muted mb-4">
                Oops! Something went wrong on our end. We are working to fix the issue. Please try again later.
            </p>
            <a href="{% url 'home' %}" class="btn btn-primary px-4">Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
