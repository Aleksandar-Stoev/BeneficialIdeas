{% extends 'base.html' %}

{% block title %}Delete Idea{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Delete Idea</h2>
    <p class="text-danger">Are you sure you want to delete this idea? This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="mt-3">
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'ideas:detail' object.pk %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
