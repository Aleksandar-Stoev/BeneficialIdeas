<nav>
    <ul>
        <li><a href="{% url 'home' %}">Home</a></li>
        <li><a href="{% url 'ideas:list' %}">All Ideas</a></li>

        {% if request.user.is_authenticated %}
            <li><a href="{% url 'ideas:create' %}">Create Idea</a></li>
            <li><a href="{% url 'accounts:details' pk=request.user.pk %}">My Profile</a></li>
            <form action="{% url 'accounts:logout' %}" style="display: inline;" method="post">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        {% else %}
            <li><a href="{% url 'accounts:login' %}">Login</a></li>
            <li><a href="{% url 'accounts:register' %}">Register</a></li>
        {% endif %}
    </ul>
</nav>
