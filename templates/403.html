{% extends 'base.html' %}

{% block title %}403 - Forbidden{% endblock %}

{% block content %}
<div class="row justify-content-center text-center mt-5 mb-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 p-5">
            <div class="display-1 fw-bold text-warning mb-3">403</div>
            <h1 class="h3 fw-bold text-dark mb-3">Access Denied</h1>
            <p class="text-muted mb-4">
                Sorry, you don't have permission to view this page. If you believe this is a mistake, please contact an administrator.
            </p>
            <a href="{% url 'home' %}" class="btn btn-primary px-4">Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
