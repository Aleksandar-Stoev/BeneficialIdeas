{% extends 'base.html' %}

{% block title %}Registration - Beneficial Ideas{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4 mb-5">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 p-4 p-md-5">
            <h2 class="h3 fw-bold text-dark text-center mb-4">Create a Profile</h2>

            <form method="post" novalidate>
                {% csrf_token %}

                {% if form.non_field_errors %}
                    <div class="alert alert-danger">
                        {{ form.non_field_errors }}
                    </div>
                {% endif %}

                <div class="mb-3">
                    {{ form.as_p }}
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Sign Up</button>
                </div>
            </form>

            <div class="text-center mt-4 pt-3 border-top text-muted small">
                Do you already have a profile? <a href="{% url 'accounts:login' %}" class="text-decoration-none fw-semibold">Enter here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
