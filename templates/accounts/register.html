{% extends 'base.html' %}

{% block title %}Registration - Beneficial Ideas{% endblock %}

{% block content %}
<div class="register-container">
    <h2>Create a profile</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Sign up</button>
    </form>

    <p style="margin-top: 15px;">
        Do you already have a profile? <a href="{% url 'login' %}">Enter here</a>
    </p>
</div>
{% endblock %}
